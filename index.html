<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="icon.png">

<style>
:root{--charcoal:#3E3D3B;--pearl:#EBEBE9;--cream:#F9F6F1;--stone:#86857F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--cream);color:var(--charcoal);font-family:'IBM Plex Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:url(bg.jpg) center/cover;z-index:-1}
.wrap{max-width:440px;margin:0 auto;padding:56px 22px 40px;display:flex;flex-direction:column;align-items:center}
.logo{width:68%;max-width:280px}
.tag{font:500 10.5px Montserrat;letter-spacing:.42em;color:var(--stone);margin-top:14px;padding-left:.42em;direction:ltr}
.bio{font-size:14px;color:var(--charcoal);margin-top:18px;text-align:center;line-height:1.8;opacity:.85}
.social{display:flex;gap:14px;margin:20px 0 26px}
.social a{width:44px;height:44px;border-radius:50%;border:1px solid var(--charcoal);display:grid;place-items:center;color:var(--charcoal);background:rgba(249,246,241,.7);transition:.2s}
.social a:hover{background:var(--charcoal);color:var(--cream)}
.social svg{width:20px;height:20px}
.links{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.82);border:1px solid #DAD8D3;color:var(--charcoal);text-decoration:none;backdrop-filter:blur(4px);transition:.2s;cursor:pointer;font:inherit;text-align:right}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(62,61,59,.10)}
.btn.primary{background:var(--charcoal);color:var(--cream);border-color:var(--charcoal)}
.btn .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pearl);flex:none}
.btn.primary .ic{background:rgba(249,246,241,.14)}
.btn .ic svg{width:18px;height:18px}
.btn .tx{flex:1;display:flex;flex-direction:column;line-height:1.35}
.btn .t{font-weight:600;font-size:15.5px}
.btn .s{font:400 10.5px Montserrat;letter-spacing:.14em;opacity:.6;direction:ltr;text-align:right;text-transform:uppercase;margin-top:2px}
.btn .ar{opacity:.45;font-size:18px}
details{width:100%}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.panel{margin-top:-6px;padding:16px 18px 14px;background:rgba(255,255,255,.82);border:1px solid #DAD8D3;border-top:0;border-radius:0 0 14px 14px;font-size:13.5px;line-height:1.9}
details[open] .btn{border-radius:14px 14px 0 0}
.foot{margin-top:34px;text-align:center}
.foot .ship{font:500 14px 'IBM Plex Sans Arabic',sans-serif;letter-spacing:0;color:var(--charcoal);opacity:.85;margin:0;direction:rtl}
.foot .ship-en{font:500 10.5px Montserrat;letter-spacing:.3em;color:var(--stone);margin-top:6px;direction:ltr}
.foot img{width:54px;opacity:.85}
.foot p{font:400 10px Montserrat;letter-spacing:.3em;color:var(--stone);margin-top:8px;direction:ltr}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="logo.png" alt="SHUHRAH Fashion House">

  <div style="height:26px"></div>

  <div class="links">

      <span class="tx"><span class="t">تواصلي معنا واتساب</span><span class="s" dir="ltr">WhatsApp · +974 5053 9929</span></span><span class="ar">‹</span>

    <a class="btn" href="https://www.tiktok.com/@shuhraah" data-app="tiktok" data-user="shuhraah">
      <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.27 0 .53.04.78.12V9.8a5.7 5.7 0 1 0 4.9 5.6V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/></svg></span>

    </a>

  <footer class="foot">

    <p class="ship-en">WE SHIP WORLDWIDE</p>
  </footer>
</main>
<script>
/* Open Instagram / TikTok in the app on phones instead of the "download the app" web page */
(function(){
  var ua=navigator.userAgent||"", isAndroid=/android/i.test(ua), isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  window.addEventListener("pageshow",function(){clearTimeout(window.__fb);});
  window.addEventListener("pagehide",function(){clearTimeout(window.__fb);});
  if(!isAndroid&&!isIOS) return;
  var PKG={instagram:"com.instagram.android",tiktok:"com.zhiliaoapp.musically"};
  function webUrl(a,u){return a==="instagram"?"https://www.instagram.com/"+u+"/":"https://www.tiktok.com/@"+u;}
  document.querySelectorAll("a[data-app]").forEach(function(el){
    el.addEventListener("click",function(e){
      var a=el.dataset.app,u=el.dataset.user,web=webUrl(a,u);
      if(isAndroid){
        e.preventDefault();
        var path=a==="instagram"?"www.instagram.com/_u/"+u+"/":"www.tiktok.com/@"+u;
        location.href="intent://"+path+"#Intent;scheme=https;package="+PKG[a]+";S.browser_fallback_url="+encodeURIComponent(web)+";end";
        return;
      }
      if(isIOS&&a==="instagram"){
        e.preventDefault();
        var left=false;
        var onHide=function(){if(document.hidden)left=true;};
        document.addEventListener("visibilitychange",onHide);
        location.href="instagram://user?username="+encodeURIComponent(u);
        window.__fb=setTimeout(function(){document.removeEventListener("visibilitychange",onHide);if(!left&&!document.hidden)location.href=web;},1600);
      }
      /* iOS TikTok: the normal https link is a universal link that opens the app from Safari */
    });
  });
})();
</script>
</body>
</html>
